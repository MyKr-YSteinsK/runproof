name: RPF-100 Local Product
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rpf-100-product.yml'
      - 'runtime/**'
      - 'ci/**'
      - 'demo/**'
      - 'web/**'
      - 'spikes/rpf-115/**'
      - 'spikes/rpf-116/**'
      - 'spikes/rpf-117/**'
      - 'spikes/rpf-118/**'
      - 'spikes/rpf-119/**'
      - 'spikes/rpf-120/**'
      - 'spikes/rpf-4[3467]/*.json'
      - 'docs/**'
      - 'README*.md'
      - 'AGENTS.md'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'package*.json'
      - 'control-plane/**'
      - 'integrations/jiuwenswarm/**'
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The Golden Demo verifies that its frozen source commit exists.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          python -B -m unittest -v ci.test_control_plane_client_transport runtime.tests.test_control_plane_client
          runtime.tests.test_durable_worker ci.test_rpf100_product ci.test_rpf112_competition
          ci.test_rpf114_competition_agent ci.test_rpf113_competition_bundle ci.test_rpf114_competition_bundle
          ci.test_rpf115_recovery ci.test_rpf116_investigation ci.test_policy_evaluation
          ci.test_fixture_model_evaluation ci.test_rpf119_live ci.test_rpf120_reconcile ci.test_rpf124_r72r2
          ci.test_timeout_experiment ci.test_rpf131_preflight ci.test_rpf132
      - run: node --test ci/test_rpf113_competition_server.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build -- --outDir .local/rpf-100-product/ci-build
      - run: python -B ci/verify-public-docs.py
      - run: python -B runtime/verify-reviewed-artifacts.py
      - run: python -B demo/verify-golden-demo.py --root . --json
