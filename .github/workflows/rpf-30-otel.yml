name: RPF-30 Focused OpenTelemetry Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpf30-otel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-otel-contract:
    name: Formal OTel disabled/healthy/unavailable contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formal Python SDKs
        run: python -m pip install --requirement runtime/requirements.txt

      - name: Prepare pinned disposable images
        run: |
          docker pull postgres:16-alpine
          docker pull alpine:3.22
          docker pull python:3.12-alpine
          docker pull ghcr.io/shopify/toxiproxy:2.12.0
          docker pull otel/opentelemetry-collector-contrib:0.157.0

      - name: Package formal Control Plane
        run: mvn -q test package -f control-plane/pom.xml

      - name: Run formal OTel probe
        run: python spikes/rpf-30/probe.py --run --hosted --output-dir ci-results/rpf30

      - name: Verify formal OTel evidence
        run: python spikes/rpf-30/verify-evidence.py ci-results/rpf30/rpf30-result.json

      - name: Upload focused OTel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf-30-otel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/rpf30
          if-no-files-found: error
          retention-days: 14
