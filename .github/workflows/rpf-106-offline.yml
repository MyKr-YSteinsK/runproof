name: RPF-106 Trusted Controller Offline
on:
  push:
    branches: [main]
    paths:
      - 'runtime/runproof_runtime/effectwitness/pge_r106_contracts.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r106_ledger.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r106_authority.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r106_targets.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r106_controller.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r106_oracle.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r106_replay.py'
      - 'ci/test_rpf106_controller.py'
      - 'ci/test_rpf106_candidates.py'
      - '.github/workflows/rpf-106-offline.yml'
      - 'spikes/rpf-106/README.md'
      - 'spikes/rpf-106/RESULT.md'
      - 'spikes/rpf-106/acceptance.json'
      - 'spikes/rpf-106/verification-diagnostic.json'
      - 'spikes/rpf-106/source-map.json'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh-owner SQLite and controller controls
        env:
          RPF106_LOCAL_SQLITE: '1'
          RPF106_SOURCE_SHA: ${{ github.sha }}
        run: |
          git check-ignore -q -- .local/rpf-106/probe
          python -B -m unittest -v ci.test_rpf106_candidates ci.test_rpf106_controller
      - name: Historical pure admission regression
        run: |
          python -B -m unittest -v \
            ci.test_rpf105_explorer_admission.ExplorerAdmissionTests.test_continuation_needs_the_pinned_feedback \
            ci.test_rpf105_explorer_admission.ExplorerAdmissionTests.test_feedback_scope_and_freshness_even_if_rehashed \
            ci.test_rpf105_explorer_admission.ExplorerAdmissionTests.test_latch_and_uncertain_reconciliation_block_every_effect
      - run: python -B ci/verify-public-docs.py
