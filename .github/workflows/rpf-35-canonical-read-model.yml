name: RPF-35 bounded Canonical Metadata read model

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rpf-35-canonical-read-model.yml"
      - "control-plane/**"
      - "runtime/runproof_runtime/control_plane_client.py"
      - "spikes/rpf-35/**"
      - "web/src/**"
      - "AGENTS.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rpf-35-canonical-read-model.yml"
      - "control-plane/**"
      - "runtime/runproof_runtime/control_plane_client.py"
      - "spikes/rpf-35/**"
      - "web/src/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpf35-canonical-read-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-read-proof:
    name: Hosted bounded Canonical Metadata proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare pinned disposable image
        run: docker pull postgres:16-alpine
      - name: Package formal Control Plane
        run: mvn -q test package -f control-plane/pom.xml
      - name: Run RPF-35 hosted-focused proof
        run: python spikes/rpf-35/probe.py --run --output-dir ci-results/rpf35
      - name: Verify RPF-35 evidence
        shell: bash
        run: |
          set -euo pipefail
          result="$(find ci-results/rpf35 -type f -name 'rpf35-result.json' -print -quit)"
          test -n "$result"
          python spikes/rpf-35/verify-evidence.py "$result"
      - name: Upload RPF-35 diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf-35-canonical-read-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/rpf35
          if-no-files-found: error
          retention-days: 14
