name: RPF-12 Canonical Release Gate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-gate.yml"
      - "ci/**"
      - "control-plane/**"
      - "runtime/**"
      - "spikes/rpf-16/**"
      - "spikes/rpf-17/**"
      - "spikes/rpf-18/**"
      - "demo/**"
      - "docs/DEMO.md"
      - "docs/**"
      - "README.md"
      - "README.zh-CN.md"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release-gate.yml"
      - "ci/**"
      - "control-plane/**"
      - "runtime/**"
      - "spikes/rpf-16/**"
      - "spikes/rpf-17/**"
      - "spikes/rpf-18/**"
      - "demo/**"
      - "docs/DEMO.md"
      - "docs/**"
      - "README.md"
      - "README.zh-CN.md"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpf12-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-release-gate:
    name: Fresh canonical Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formal Runtime requirements
        run: python -m pip install --requirement runtime/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Web dependencies
        run: npm ci

      - name: Prepare fixed Docker runtime image
        run: docker pull alpine:3.22

      - name: Run focused cross-platform safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            runtime.tests.test_effectwitness_config_live.ConfigLiveContractsTests.test_denied_file_diagnostic_keeps_only_a_bounded_safe_basename \
            runtime.tests.test_effectwitness_config_target.ConfigTargetVerifierBoundaryTests.test_sdk_child_guard_allows_reads_from_resolved_base_python_runtime
          python -B -m unittest -v ci.test_rpf83_ci_preconditions
          python -B -m unittest -v ci.test_run_runtime_contract_tests.DirFdSafetyTests

      - name: Run repository contract checks
        env:
          RPF82_TEST_ROOT: ${{ github.workspace }}/ci-results/rpf83-r60-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/verify-public-docs.py
          set +e
          python -B ci/run-runtime-contract-tests.py --output "$GITHUB_WORKSPACE/ci-results/rpf84-${{ github.run_id }}-${{ github.run_attempt }}"
          router_rc=$?
          set -euo pipefail
          python -B ci/verify-runtime-coverage-handoff.py assess \
            --ledger "$GITHUB_WORKSPACE/ci-results/rpf84-${{ github.run_id }}-${{ github.run_attempt }}/ledger.json" \
            --runner-exit "$router_rc" \
            --output "$GITHUB_WORKSPACE/ci-results/rpf85-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"
          python runtime/verify-reviewed-artifacts.py
          python spikes/rpf-16/probe.py --verify
          python spikes/rpf-17/verify-evidence.py
          python spikes/rpf-18/verify-evidence.py
          python demo/verify-golden-demo.py --root . --json
          mvn -q test package -f control-plane/pom.xml
          npm test
          npm run typecheck
          npm run build

      - name: Capture bounded Router failure evidence
        id: rpf90_capture
        if: ${{ always() }}
        run: |
          python -B ci/diagnose-runtime-router-gate.py capture \
            --ledger "$GITHUB_WORKSPACE/ci-results/rpf84-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/ledger.json" \
            --output "$GITHUB_WORKSPACE/ci-results/rpf90-router-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"

      - name: Upload bounded Router failure evidence
        if: ${{ always() && (steps.rpf90_capture.outcome == 'success' || steps.rpf90_capture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf90-router-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/rpf90-router-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Run fresh canonical Release Gate
        run: python ci/run_release_gate.py --repo-root "$GITHUB_WORKSPACE" --output-dir ci-results

      - name: Run RPF-86 dedicated-owner admission pilot
        id: rpf86_pilot
        run: python -B ci/run-rpf86-owner-admission.py --output "$GITHUB_WORKSPACE/ci-results/rpf86-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Reconcile admitted RPF-86 required methods
        id: rpf87_assess
        shell: bash
        run: |
          set -euo pipefail
          python -B ci/reconcile-rpf86-required-coverage.py assess \
            --ledger "$GITHUB_WORKSPACE/ci-results/rpf84-${{ github.run_id }}-${{ github.run_attempt }}/ledger.json" \
            --handoff "$GITHUB_WORKSPACE/ci-results/rpf85-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --pilot "$GITHUB_WORKSPACE/ci-results/rpf86-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$GITHUB_WORKSPACE/ci-results/rpf87-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"

      - name: Record verified RPF-87 post-completion boundary
        if: ${{ success() && steps.rpf87_assess.outcome == 'success' }}
        env:
          RPF87_STEP_OUTCOME: ${{ steps.rpf87_assess.outcome }}
        run: |
          python -B ci/reconcile-rpf88-required-coverage.py stamp \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"

      - name: Run RPF-88 R72 fresh-owner cohort pilot
        id: rpf88_pilot
        run: python -B ci/run-rpf88-r72-owner-scope.py --output "$GITHUB_WORKSPACE/ci-results/rpf88-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Reconcile admitted RPF-88 R72 required methods
        id: rpf89_assess
        run: |
          python -B ci/reconcile-rpf88-required-coverage.py assess \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"

      - name: Verify Job Summary contract
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          summary_file="ci-results/rpf12-release-gate-summary.md"
          test -s "$summary_file"
          grep -Fq "RPF-12 Canonical Release Gate" "$summary_file"
          grep -Fq "Baseline control" "$summary_file"
          grep -Fq "Candidate Gate" "$summary_file"
          grep -Fq "Final Decision" "$summary_file"
          grep -Fq "No release executed; no deployment authorization." "$summary_file"
          echo "Job Summary contract verified without emitting its contents."

      - name: Upload machine-readable Gate result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf-12-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/rpf12-release-gate-result.json
            ci-results/rpf12-release-gate-summary.md
            ci-results/rpf85-coverage-*.json
            ci-results/rpf87-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload redacted RPF-86 pilot result
        if: ${{ always() && (steps.rpf86_pilot.outcome == 'success' || steps.rpf86_pilot.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf86-dedicated-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/rpf86-${{ github.run_id }}-${{ github.run_attempt }}/public-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload redacted RPF-88 pilot result
        if: ${{ always() && (steps.rpf88_pilot.outcome == 'success' || steps.rpf88_pilot.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf88-r72-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/rpf88-${{ github.run_id }}-${{ github.run_attempt }}/public-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload RPF-89 derived required coverage
        if: ${{ always() && (steps.rpf89_assess.outcome == 'success' || steps.rpf89_assess.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rpf89-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/rpf89-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce all required Runtime coverage
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python -B ci/reconcile-rpf86-required-coverage.py enforce \
            --ledger "$GITHUB_WORKSPACE/ci-results/rpf84-${{ github.run_id }}-${{ github.run_attempt }}/ledger.json" \
            --handoff "$GITHUB_WORKSPACE/ci-results/rpf85-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --pilot "$GITHUB_WORKSPACE/ci-results/rpf86-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$GITHUB_WORKSPACE/ci-results/rpf87-coverage-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"
      - name: Enforce RPF-89 derived required coverage
        if: ${{ always() }}
        run: |
          python -B ci/reconcile-rpf88-required-coverage.py enforce \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"
