name: RPF-105 Evidence and Explorer Admission Offline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rpf-105-offline.yml'
      - 'ci/rpf105_verify_archive.py'
      - 'ci/test_rpf105_verify_archive.py'
      - 'ci/test_rpf105_explorer_admission.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r105_contracts.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r105_gate.py'
      - 'runtime/runproof_runtime/effectwitness/pge_r105_replay.py'
      - 'spikes/rpf-105/README.md'
      - 'spikes/rpf-105/RESULT.md'
      - 'spikes/rpf-105/acceptance.json'
      - 'spikes/rpf-105/verification-diagnostic.json'
      - 'spikes/rpf-105/source-map.json'
      - 'spikes/rpf-105/evidence/rpf104-run-42647430199-actions.zip'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest -v ci.test_rpf105_verify_archive ci.test_rpf105_explorer_admission
      - run: python -B -m unittest -v ci.test_rpf103_verify_archive
      - run: python -B ci/verify-public-docs.py
