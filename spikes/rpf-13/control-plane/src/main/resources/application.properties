spring.application.name=rpf-13-durable-execution-probe
spring.main.banner-mode=off

server.address=${RPF_CONTROL_PLANE_ADDRESS:127.0.0.1}
server.port=${RPF_CONTROL_PLANE_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${RPF_JDBC_URL}
spring.datasource.username=${RPF_DB_USER}
spring.datasource.password=${RPF_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.sql.init.mode=never

rpf.persistence.schema-version=rpf-13-durable-execution-schema-v1
