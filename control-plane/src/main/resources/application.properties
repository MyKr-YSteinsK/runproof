spring.application.name=runproof-control-plane
spring.main.banner-mode=off
spring.jackson.default-property-inclusion=non_null

server.address=${RPF_CONTROL_PLANE_ADDRESS:127.0.0.1}
server.port=${RPF_CONTROL_PLANE_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${RPF_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/runproof}
spring.datasource.username=${RPF_DB_USER:runproof}
spring.datasource.password=${RPF_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.sql.init.mode=never

rpf.persistence.schema-version=rpf-14-durable-execution-schema-v1
rpf.artifact-store.backend=${RPF_ARTIFACT_STORE_BACKEND:local}
rpf.artifact-store.root=${RPF_ARTIFACT_STORE_ROOT:.local/control-plane/artifacts}
rpf.artifact-store.s3.endpoint=${RPF_ARTIFACT_STORE_S3_ENDPOINT:}
rpf.artifact-store.s3.region=${RPF_ARTIFACT_STORE_S3_REGION:us-east-1}
rpf.artifact-store.s3.bucket=${RPF_ARTIFACT_STORE_S3_BUCKET:}
rpf.artifact-store.s3.prefix=${RPF_ARTIFACT_STORE_S3_PREFIX:}
rpf.artifact-store.s3.access-key=${RPF_ARTIFACT_STORE_S3_ACCESS_KEY:}
rpf.artifact-store.s3.secret-key=${RPF_ARTIFACT_STORE_S3_SECRET_KEY:}
rpf.artifact-store.s3.path-style-access=${RPF_ARTIFACT_STORE_S3_PATH_STYLE_ACCESS:true}
rpf.artifact-store.s3.connect-timeout-ms=${RPF_ARTIFACT_STORE_S3_CONNECT_TIMEOUT_MS:2000}
rpf.artifact-store.s3.api-timeout-ms=${RPF_ARTIFACT_STORE_S3_API_TIMEOUT_MS:5000}
rpf.artifact-store.s3.attempt-timeout-ms=${RPF_ARTIFACT_STORE_S3_ATTEMPT_TIMEOUT_MS:5000}
rpf.probe.enabled=${RPF_PROBE_ENABLED:false}

# Optional diagnostic OpenTelemetry.  No endpoint means a true no-op path;
# these settings never participate in canonical execution or release authority.
rpf.otel.enabled=${RPF_OTEL_ENABLED:false}
rpf.otel.endpoint=${RPF_OTEL_ENDPOINT:}
rpf.otel.service-name=${RPF_OTEL_SERVICE_NAME:runproof-control-plane}
rpf.otel.queue-size=${RPF_OTEL_QUEUE_SIZE:256}

rpf.auth.read-token=${RPF_AUTH_READ_TOKEN:}
rpf.auth.evidence-token=${RPF_AUTH_EVIDENCE_TOKEN:}
rpf.auth.decision-token=${RPF_AUTH_DECISION_TOKEN:}
rpf.auth.agent-token=${RPF_AUTH_AGENT_TOKEN:}
rpf.auth.ci-token=${RPF_AUTH_CI_TOKEN:}
rpf.auth.worker-token=${RPF_AUTH_WORKER_TOKEN:}
